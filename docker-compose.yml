services:
  postgres:
    image: postgres:16-alpine
    container_name: record-collection-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: record_collection_test
    ports:
      # 5433 on the host, so this never collides with a local Postgres on 5432.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d record_collection_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      # The test database is disposable and recreated from migrations on every
      # run, so keeping it in memory costs nothing and makes resets fast.
      - /var/lib/postgresql/data

  # **The Neon serverless driver, run against local Postgres.**
  #
  # `@neondatabase/serverless` speaks Postgres over a WebSocket rather than a
  # TCP socket, so it cannot reach the `postgres` service above directly. This
  # is Neon's own proxy, which terminates the WebSocket and forwards to plain
  # Postgres -- so the nine transaction tests exercise the REAL production
  # driver with no remote branch and no network.
  #
  # It replaces a throwaway Neon branch whose credential expired on a weekly
  # cycle, leaving `test/integration/neon-transactions.test.ts` failing with
  # `28P01 password authentication failed` and the transaction guarantees
  # unverified between rotations. The chore is gone rather than rescheduled.
  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    container_name: record-collection-wsproxy
    environment:
      # NOT `APPEND_PORT`: the driver already sends `?address=host:port`, and
      # appending to it produced `postgres:5432postgres:5432` -- "too many
      # colons in address" in the proxy's log. The address the client asks for
      # is the one dialled, and `ALLOW_ADDR_REGEX` is what constrains it.
      ALLOW_ADDR_REGEX: '.*'
      LOG_TRAFFIC: 'false'
    ports:
      - '5434:80'
    depends_on:
      postgres:
        condition: service_healthy
