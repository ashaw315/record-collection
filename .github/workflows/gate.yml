# The gate on GitHub's machines (CLAUDE.md §10): the full suites at one commit,
# started by hand, one gate per completed unit. A trial until NOTES says
# otherwise: geometry tuned on macOS browsers may not hold on Linux, and a
# failure here is sorted before it is believed. No assertion is loosened to pass.
#
# It needs no secret. `.env.test` is committed and points at the Postgres the
# jobs start for themselves; no test makes a live call, and production is never
# reached. It holds its own copies of neither DATABASE_URL nor anything else.
#
# `playwright.config.ts` reads CI=true as one worker and two retries, which is
# not the gate: the flags below keep the two workers and one retry that a
# retry's meaning, and the gate's verdict, were judged on.
name: Gate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to gate
        required: true

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/record_collection_test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/record_collection_test

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: docker compose up -d --wait
      # `src/app/type-scale.test.ts` reads the CSS a build produces. As in gate.sh, the build is given no database.
      - run: env -u TEST_DATABASE_URL -u DATABASE_URL npm run build
      - name: Unit suite
        run: |
          mkdir -p gate-logs
          npx tsx scripts/run-tests.ts npm test > "gate-logs/$(git rev-parse --short HEAD)-unit.log" 2>&1 || true
          tail -5 gate-logs/*-unit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit
          path: gate-logs
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: mobile
            browser: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: docker compose up -d --wait
      - name: Playwright, ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p gate-logs
          npx tsx scripts/run-tests.ts npx playwright test --project="$PROJECT" --output "test-results/$PROJECT" --workers=2 --retries=1 > "gate-logs/$(git rev-parse --short HEAD)-e2e-$PROJECT.log" 2>&1 || true
          tail -5 gate-logs/*-e2e-"$PROJECT".log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.project }}
          path: |
            gate-logs
            test-results
          retention-days: 14

  verdict:
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The script at the commit gated, reading what the halves wrote; its status is the verdict, not any step's above.
      - name: The gate's verdict
        run: |
          C="$(git rev-parse --short HEAD)"
          bash scripts/gate-report.sh "$C" "artifacts/unit/$C-unit.log" "chromium=artifacts/e2e-chromium/gate-logs/$C-e2e-chromium.log" "mobile=artifacts/e2e-mobile/gate-logs/$C-e2e-mobile.log"
