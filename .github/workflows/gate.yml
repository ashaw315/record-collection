# The gate on GitHub's machines (CLAUDE.md §10): the full suites at one commit,
# started by hand, one gate per completed unit. A trial until NOTES says
# otherwise: geometry tuned on macOS browsers may not hold on Linux, and a
# failure here is sorted before it is believed. No assertion is loosened to pass.
# A green job here means the half's own last line read OK, never that a command
# exited 0: the first run's jobs were green with no e2e test run at all.
#
# `test/repo/dev-targets-neon.test.ts` reads the developer's own `.env.local`,
# which a runner does not have. It is removed from this checkout by name, because
# each vitest project's own `exclude` overrides the CLI's. It still runs on every
# commit through commit-checked.sh.
#
# It needs no secret. `.env.test` is committed and points at the Postgres the
# jobs start for themselves; no test makes a live call, and production is never
# reached. It holds its own copies of neither DATABASE_URL nor anything else.
#
# `playwright.config.ts` reads CI=true as one worker and two retries, which is
# not the gate: the flags below keep the one retry that a retry's meaning, and
# the gate's verdict, were judged on. One worker on CI and two on the local gate,
# by decision: CI's extra half hour costs nobody, and each run here is evidence
# on whether the shared database is the whole flake class.
name: Gate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to gate, its full id
        required: true
      workers:
        description: Playwright workers. 1 by default, the coordinator, 2 Nov. Workers share each job's database, and that has flaked three specs five times.
        default: '1'

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/record_collection_test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/record_collection_test
  # Colour in a piped vitest breaks every parse of its summary, including neon-gate.test.ts's.
  NO_COLOR: '1'

jobs:
  # The input refused here, before any job checks it out. actions/checkout
  # reads a seven-character id as a branch name that does not exist, and every
  # job then fails in seconds with the reason only in its log: 41734064967 and
  # 41738856433 on 3 Nov, 42106636860 on 5 Nov. After the first two,
  # scripts/ci-gate.sh became the dispatcher that can only hand over forty
  # characters; the third was dispatched by hand around it. A guard that is
  # present, correct and not on the path is worse than none, because a reader
  # of the guard stops checking (the coordinator, 5 Nov). This one is on every
  # path, since every dispatch arrives here, and it cannot be bypassed by a
  # dispatcher that forgets to resolve.
  commit-id:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: refuse anything but a full forty-character commit id
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          case "$COMMIT" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
              echo "commit ${COMMIT}: a full id, the gate runs" ;;
            *)
              echo "::error::REFUSED: the commit input must be the full forty-character id; got '${COMMIT}' (${#COMMIT} characters). Dispatch with scripts/ci-gate.sh <ref> [workers], which resolves it."
              echo "REFUSED: commit '${COMMIT}' is not a forty-character id; nothing was checked out and nothing ran" >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
          esac

  unit:
    needs: commit-id
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: docker compose up -d --wait
      # `src/app/type-scale.test.ts` reads the CSS a build produces. As in gate.sh, the build is given no database.
      - run: env -u TEST_DATABASE_URL -u DATABASE_URL npm run build
      # The log sits outside the tree: inside it, the run's "tree unchanged" reads the log growing.
      - name: Unit suite
        run: |
          LOG="$RUNNER_TEMP/gate-logs/$(git rev-parse --short=7 HEAD)-unit.log"
          mkdir -p "$(dirname "$LOG")"
          rm test/repo/dev-targets-neon.test.ts
          npx tsx scripts/run-tests.ts npm test > "$LOG" 2>&1 || true
          tail -5 "$LOG"
          tail -1 "$LOG" | grep -q -- '— OK'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit
          path: ${{ runner.temp }}/gate-logs
          retention-days: 14

  e2e:
    needs: commit-id
    runs-on: ubuntu-latest
    # One worker takes about twice two workers' 56 minutes, and a job cut off reports nothing.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: mobile
            browser: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: docker compose up -d --wait
      # Locally the unit suite's setup migrates; here each job has a database of its own.
      - run: NODE_ENV=test npx drizzle-kit migrate
      # Against a build, as Vercel serves the app, and not next dev: the webServer builds and starts
      # (playwright.config.ts, E2E_SERVER). Under four workers a dev server's first response to a route
      # is a compile, and five tests missed their budgets on it (Q39, 5 Nov). The build's own output is
      # in the log, so its cost is read there and not inferred.
      - name: Playwright, ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
          E2E_SERVER: build
        run: |
          LOG="$RUNNER_TEMP/gate-logs/$(git rev-parse --short=7 HEAD)-e2e-$PROJECT.log"
          mkdir -p "$(dirname "$LOG")"
          npx tsx scripts/run-tests.ts npx playwright test --project="$PROJECT" --output "test-results/$PROJECT" --workers=${{ inputs.workers }} --retries=1 > "$LOG" 2>&1 || true
          tail -5 "$LOG"
          tail -1 "$LOG" | grep -q -- '— OK'
      # The report-only project (the coordinator, 10 Nov): parked tests, record-band-43:33 first, run after the gating
      # shard on the same machine and recorded, never judged. It runs whatever the shard found, and never fails the job.
      - name: Report-only tests, recorded and not judged
        if: always() && matrix.project == 'chromium'
        env:
          E2E_SERVER: build
        run: |
          LOG="$RUNNER_TEMP/gate-logs/$(git rev-parse --short=7 HEAD)-e2e-report-only.log"
          npx tsx scripts/run-tests.ts npx playwright test --project=report-only --output "test-results/report-only" --workers=${{ inputs.workers }} --retries=1 > "$LOG" 2>&1 || true
          tail -5 "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.project }}
          path: ${{ runner.temp }}/gate-logs
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results
          retention-days: 14

  verdict:
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The script at the commit gated, reading what the halves wrote; its status is the verdict, not any step's above.
      - name: The gate's verdict
        run: |
          C="$(git rev-parse --short=7 HEAD)"
          # One directory: each job's artifact arrives in its own, and gate-report refuses logs from more than one. A missing log stays missing, and the report says so.
          mkdir -p logs
          cp artifacts/*/"$C"-*.log logs/ || true
          REPORT_ONLY_LOG="logs/$C-e2e-report-only.log" bash scripts/gate-report.sh "$C" "logs/$C-unit.log" "chromium=logs/$C-e2e-chromium.log" "mobile=logs/$C-e2e-mobile.log"
