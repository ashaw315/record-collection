# One run, on GitHub's machines: which type Linux actually draws, for comparing with
# the same probe on macOS (e2e/font-probe.capture.ts). It asserts nothing, and it is
# not a gate. Delete it with the probe once the twelve Linux failures are settled.
name: Font probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/record_collection_test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/record_collection_test

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: docker compose up -d --wait
      - run: NODE_ENV=test npx drizzle-kit migrate
      - run: npx playwright test --config=playwright.font-probe.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-probe
          path: font-probe-*.json
